# Polylangin Linux: pinyin -> Chinese only (no lua/octagram plugins needed).
schema:
  schema_id: polylangin
  name: Polylangin
  version: "0.1"
  author: Polylangin
  description: 中英法混合输入；英文/法文由宿主层处理

switches:
  - name: ascii_mode
    reset: 0
    states: [中, 英]

menu:
  page_size: 9

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 模糊拼音：只开前后鼻音（和 macOS 版一致）
    - derive/ang$/an/
    - derive/an$/ang/
    - derive/eng$/en/
    - derive/en$/eng/
    - derive/ing$/in/
    - derive/in$/ing/
    - derive/iang$/ian/
    - derive/ian$/iang/
    - derive/uang$/uan/
    - derive/uan$/uang/

translator:
  dictionary: polylangin
  spelling_hints: 3
